MOD_SCHLAMP_LOGOLEISTE="Schlamp – Logoleiste"
MOD_SCHLAMP_LOGOLEISTE_XML_DESCRIPTION="Gleichmäßig nach links laufende Logoleiste aus einem lokalen Bilderordner. Optionale Links, responsive Logoanzahl und einstellbare Umlaufdauer. Für Joomla 5 und PHP 8.3+."
MOD_SCHLAMP_LOGOLEISTE_CONTENT="Bilder und Links"
MOD_SCHLAMP_LOGOLEISTE_FOLDER="Bilderordner"
MOD_SCHLAMP_LOGOLEISTE_FOLDER_DESC="Relativ zum Joomla-Verzeichnis, z. B. images/logoleiste. Liest JPG, PNG, WebP, SVG, GIF und AVIF direkt aus diesem Ordner, ohne Unterordner. Sortierung nach Dateinamen; Reihenfolge z. B. mit 01-, 02-, 03- festlegen. Fehlender oder leerer Ordner: keine Ausgabe."
MOD_SCHLAMP_LOGOLEISTE_LINKS="Optionale Links und Bezeichnungen"
MOD_SCHLAMP_LOGOLEISTE_LINKS_DESC="Eine Zeile pro Logo: dateiname.png | https://www.beispiel.de | Bezeichnung. Dateiname muss exakt passen. Ohne Eintrag bleibt das Bild unverlinkt. Für eine reine Bezeichnung: dateiname.png | | Bezeichnung. Erlaubt: http://, https:// oder /interner-pfad (ab Domainwurzel). Kommentarzeilen beginnen mit #. Ungültige Links werden nicht ausgegeben."
MOD_SCHLAMP_LOGOLEISTE_TARGET="Links in neuem Tab öffnen"
MOD_SCHLAMP_LOGOLEISTE_LABEL="Bezeichnung für Screenreader (optional)"
MOD_SCHLAMP_LOGOLEISTE_APPEARANCE="Darstellung und Bewegung"
MOD_SCHLAMP_LOGOLEISTE_DESKTOP="Sichtbare Logos – Desktop"
MOD_SCHLAMP_LOGOLEISTE_TABLET="Sichtbare Logos – Tablet"
MOD_SCHLAMP_LOGOLEISTE_TABLET_DESC="Bis 991 px Modulbreite. Höchstens so viele wie auf dem Desktop. Bei weniger Bildern werden weniger Plätze angezeigt."
MOD_SCHLAMP_LOGOLEISTE_MOBILE="Sichtbare Logos – Handy"
MOD_SCHLAMP_LOGOLEISTE_MOBILE_DESC="Bis 575 px Modulbreite. Höchstens so viele wie auf dem Tablet."
MOD_SCHLAMP_LOGOLEISTE_DURATION="Dauer eines vollständigen Umlaufs (Sekunden)"
MOD_SCHLAMP_LOGOLEISTE_DURATION_DESC="5 bis 300 Sekunden für alle Logos. Größerer Wert = langsamer. Standard: 30 Sekunden. Mausberührung pausiert. Bei Tastaturbedienung, reduzierter Bewegung oder ohne JavaScript erscheinen alle Logos als ruhiges Raster. Ein einzelnes Logo bleibt statisch."
MOD_SCHLAMP_LOGOLEISTE_HEIGHT="Höhe der Logofläche (px)"
MOD_SCHLAMP_LOGOLEISTE_GAP="Abstand zwischen Logos (px)"
MOD_SCHLAMP_LOGOLEISTE_PADDING="Innenabstand oben und unten (px)"
MOD_SCHLAMP_LOGOLEISTE_REGION="Partner und Mitgliedschaften"
MOD_SCHLAMP_LOGOLEISTE_NEW_WINDOW="(öffnet in neuem Tab)"
MOD_SCHLAMP_LOGOLEISTE_WIDTH="Breite der Logofläche (px; 0 = nach Anzahl)"
MOD_SCHLAMP_LOGOLEISTE_WIDTH_DESC="Z. B. 290 für eine feste Breite. Dann bestimmt der verfügbare Platz die sichtbare Anzahl. 0 verwendet die Anzahl für Desktop/Tablet/Handy. Nur wenn das Modul schmaler als die angegebene Breite ist, wird die Fläche verkleinert."
MOD_SCHLAMP_LOGOLEISTE_HEIGHT_DESC="Exakte Höhe der Bildfläche, ohne zusätzlichen inneren Abstand. Bilder werden proportional in Breite und Höhe eingepasst, ohne Verzerrung oder Beschnitt. Weißraum in der Bilddatei bleibt erhalten."
MOD_SCHLAMP_LOGOLEISTE_BACKGROUND="Hintergrundfarbe verwenden"
MOD_SCHLAMP_LOGOLEISTE_BACKGROUND_COLOR="Hintergrundfarbe"
