MOD_SCHLAMP_LOGOLEISTE="Schlamp – Logo strip"
MOD_SCHLAMP_LOGOLEISTE_XML_DESCRIPTION="Continuous left-scrolling logo strip from a local image folder. Optional links, responsive item counts and configurable cycle duration. For Joomla 5 and PHP 8.3+."
MOD_SCHLAMP_LOGOLEISTE_CONTENT="Images and links"
MOD_SCHLAMP_LOGOLEISTE_FOLDER="Image folder"
MOD_SCHLAMP_LOGOLEISTE_FOLDER_DESC="Relative to the Joomla directory, e.g. images/logoleiste. Reads JPG, PNG, WebP, SVG, GIF and AVIF files directly, without subfolders. Natural filename order: use 01-, 02-, 03- prefixes. Missing or empty folder: no output."
MOD_SCHLAMP_LOGOLEISTE_LINKS="Optional links and labels"
MOD_SCHLAMP_LOGOLEISTE_LINKS_DESC="One line per logo: filename.png | https://www.example.com | Label. Exact filename required. Without a matching entry the image remains unlinked. Label only: filename.png | | Label. Allowed: http://, https:// or /internal-path (relative to domain root). Comment lines start with #. Invalid links are omitted."
MOD_SCHLAMP_LOGOLEISTE_TARGET="Open links in a new tab"
MOD_SCHLAMP_LOGOLEISTE_LABEL="Screen reader region label (optional)"
MOD_SCHLAMP_LOGOLEISTE_APPEARANCE="Appearance and motion"
MOD_SCHLAMP_LOGOLEISTE_DESKTOP="Visible logos – desktop"
MOD_SCHLAMP_LOGOLEISTE_TABLET="Visible logos – tablet"
MOD_SCHLAMP_LOGOLEISTE_TABLET_DESC="Up to 991 px module width. Limited to the desktop count and available images."
MOD_SCHLAMP_LOGOLEISTE_MOBILE="Visible logos – phone"
MOD_SCHLAMP_LOGOLEISTE_MOBILE_DESC="Up to 575 px module width. Limited to the tablet count."
MOD_SCHLAMP_LOGOLEISTE_DURATION="Complete cycle duration (seconds)"
MOD_SCHLAMP_LOGOLEISTE_DURATION_DESC="5 to 300 seconds for all logos. Higher values = slower. Default: 30 seconds. Hover pauses scrolling. Keyboard navigation, reduced motion and disabled JavaScript show a static grid. A single logo stays still."
MOD_SCHLAMP_LOGOLEISTE_HEIGHT="Logo frame height (px)"
MOD_SCHLAMP_LOGOLEISTE_GAP="Gap between logos (px)"
MOD_SCHLAMP_LOGOLEISTE_PADDING="Top and bottom padding (px)"
MOD_SCHLAMP_LOGOLEISTE_REGION="Partners and memberships"
MOD_SCHLAMP_LOGOLEISTE_NEW_WINDOW="(opens in a new tab)"
MOD_SCHLAMP_LOGOLEISTE_WIDTH="Logo frame width (px; 0 = by item count)"
MOD_SCHLAMP_LOGOLEISTE_WIDTH_DESC="For example, 290 sets a fixed width. The available space determines the visible count. 0 uses the desktop/tablet/phone counts. Only modules narrower than the requested width shrink the frame."
MOD_SCHLAMP_LOGOLEISTE_HEIGHT_DESC="Exact image frame height without inner padding. Images fit proportionally without distortion or cropping. Whitespace inside image files is preserved."
MOD_SCHLAMP_LOGOLEISTE_BACKGROUND="Use background color"
MOD_SCHLAMP_LOGOLEISTE_BACKGROUND_COLOR="Background color"
